{% extends 'base.html' %}

{% block title %}Delete Resource{% endblock %}

{% block content %}
<h1>Delete Resource</h1>
<p>Are you sure you want to delete <strong>{{ resource.title }}</strong>?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Yes, Delete</button>
  <a href="{% url 'resource_detail' resource.pk %}">Cancel</a>
</form>
{% endblock %}
